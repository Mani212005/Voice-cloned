[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# The audio DSP (reference cleanup, polish, time-stretch) runs in the API and engine tests;
# unoptimized it makes them several times slower.
[profile.dev.package.vc-audio]
opt-level = 3

[profile.dev.package.nnnoiseless]
opt-level = 3

[profile.dev.package.rustfft]
opt-level = 3

[project]
name = "voice-clone"
version = "0.1.0"
description = "Local voice clone and a Bluetooth hands-free call answerer for his own phone"
readme = "README.md"
authors = [
    { name = "Mani Joshi", email = "joshi.mani212005@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dbus-fast>=2.44.0",
    "librosa>=1.0.0",
    "numpy>=2.3.0",
    "openai-whisper>=20250625",
    "soundfile>=0.14.0",
    "soxr>=0.5.0",
    "torch>=2.14.1",
    "torchaudio>=2.11.0",
]

[project.scripts]
voice-clone = "voice_clone:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.13.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

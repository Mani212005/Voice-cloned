[package]
name = "vc-backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
hex = "0.4.3"
hound = "3.5.1"
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros", "sync", "process", "fs"] }
tokio-util = "0.7.20"
toml = "1.2.1"
tracing = "0.1.44"
vc-audio = { version = "0.1.0", path = "../vc-audio" }
vc-core = { version = "0.1.0", path = "../vc-core" }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }

[package]
name = "vc-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
hex = "0.4.3"
humantime = "2.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = "1.54.1"
tracing = "0.1.44"
vc-audio = { version = "0.1.0", path = "../vc-audio" }
vc-backend = { version = "0.1.0", path = "../vc-backend" }
vc-core = { version = "0.1.0", path = "../vc-core" }
vc-engine = { version = "0.1.0", path = "../vc-engine" }
vc-store = { version = "0.1.0", path = "../vc-store" }
vc-text = { version = "0.1.0", path = "../vc-text" }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "test-util"] }
tower = { version = "0.5.3", features = ["util"] }

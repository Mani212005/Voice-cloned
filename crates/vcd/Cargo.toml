[package]
name = "vcd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "net", "time"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
vc-api = { version = "0.1.0", path = "../vc-api" }
vc-audio = { version = "0.1.0", path = "../vc-audio" }
vc-backend = { version = "0.1.0", path = "../vc-backend" }
vc-core = { version = "0.1.0", path = "../vc-core" }
vc-engine = { version = "0.1.0", path = "../vc-engine" }
vc-store = { version = "0.1.0", path = "../vc-store" }
